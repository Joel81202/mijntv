name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Uitpakken en bouwen
        run: |
          rm -rf bouw uit && mkdir bouw uit
          unzip -q MijnTV-bron.zip -d bouw
          cd bouw/MijnTV
          chmod +x gradlew
          # Bouwt alle versies die in de zip zitten, wat er ook in staat
          ./gradlew assembleRelease --no-daemon --stacktrace
          for f in $(find app/build/outputs/apk -name '*-release.apk'); do
            case "$f" in
              *michel*) naam=MijnTV.apk ;;
              *public*|*vrienden*) naam=MijnTV-Public.apk ;;
              *) naam=MijnTV.apk ;;
            esac
            cp "$f" "$GITHUB_WORKSPACE/uit/$naam"
          done
          echo "Gebouwde APK's:"
          ls -la $GITHUB_WORKSPACE/uit

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MijnTV build ${{ github.run_number }}
          files: uit/*.apk
          make_latest: true
