name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Uitpakken en bouwen
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          rm -rf bouw uit && mkdir bouw uit
          unzip -q MijnTV-bron.zip -d bouw
          cd bouw/MijnTV
          chmod +x gradlew
          # Bouwt alle versies die in de zip zitten, wat er ook in staat
          ./gradlew assembleRelease --no-daemon --stacktrace
          for f in $(find app/build/outputs/apk -name '*-release.apk'); do
            case "$f" in
              *michel*) naam=MijnTV.apk ;;
              *public*|*vrienden*) naam=MijnTV-Public.apk ;;
              *) naam=MijnTV.apk ;;
            esac
            cp "$f" "$GITHUB_WORKSPACE/uit/$naam"
          done
          echo "Gebouwde APK's:"
          ls -la $GITHUB_WORKSPACE/uit
          # Versienummer en wijzigingen voor de release
          versie=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSIE=$versie" >> $GITHUB_ENV
          if [ -f WIJZIGINGEN.md ]; then
            awk '/^## /{n++} n==1' WIJZIGINGEN.md > $GITHUB_WORKSPACE/notities.md
            awk '/^## /{n++} n>=2' WIJZIGINGEN.md > eerder.md
            if [ -s eerder.md ]; then
              printf '\n\n<details><summary>Eerdere versies</summary>\n\n' >> $GITHUB_WORKSPACE/notities.md
              cat eerder.md >> $GITHUB_WORKSPACE/notities.md
              printf '\n</details>\n' >> $GITHUB_WORKSPACE/notities.md
            fi
          else
            echo "Nieuwe build" > $GITHUB_WORKSPACE/notities.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSIE }}
          name: MijnTV ${{ env.VERSIE }}
          body_path: notities.md
          files: uit/*.apk
          make_latest: true

      - name: Oude builds opruimen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases van voor versie 1.00 (build-1, build-2 …) weghalen
          gh release list --repo ${{ github.repository }} --limit 200 --json tagName -q '.[].tagName' \
            | grep '^build-' | while read t; do
              gh release delete "$t" --repo ${{ github.repository }} --yes --cleanup-tag
            done || true
