name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Uitpakken en bouwen
        run: |
          rm -rf bouw && mkdir bouw
          unzip -q MijnTV-bron.zip -d bouw
          cd bouw/MijnTV
          chmod +x gradlew
          ./gradlew assembleMichelRelease assemblePublicRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/michel/release/app-michel-release.apk $GITHUB_WORKSPACE/MijnTV.apk
          cp app/build/outputs/apk/public/release/app-public-release.apk $GITHUB_WORKSPACE/MijnTV-Public.apk
          ls -la $GITHUB_WORKSPACE/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MijnTV build ${{ github.run_number }}
          files: |
            MijnTV.apk
            MijnTV-Public.apk
          fail_on_unmatched_files: true
          make_latest: true
